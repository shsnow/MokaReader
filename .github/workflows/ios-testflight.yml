name: "iOS → TestFlight (firmado)"

# Compila MokaReader, lo firma con la API key de App Store Connect y lo sube a TestFlight.
# Solo se ejecuta a mano desde la pestaña Actions.
#
# Tres etapas: los jars del runtime JVM en Linux (barato), OpenJDK Mobile desde fuente en
# macos-14 (~45-60 min la primera vez, después queda en caché) y la app en macos-26.
#
# Secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64
# Variable opcional: BUNDLE_ID (por defecto cl.jonas.tachitest, el registro "MokaReader")

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  runtime:
    name: JVM runtime jars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Restore compat jars
        id: compat-cache
        uses: actions/cache/restore@v4
        with:
          path: Runtime/ExtensionHost/compat
          key: suwayomi-compat-${{ hashFiles('iosApp/Scripts/bootstrap-suwayomi-compat.sh', 'iosApp/Scripts/patches/suwayomi-ios-runtime.patch', 'iosApp/Scripts/gradle/copy-suwayomi-runtime.init.gradle') }}

      - name: Bootstrap compat jars
        if: steps.compat-cache.outputs.cache-hit != 'true'
        run: bash iosApp/Scripts/bootstrap-suwayomi-compat.sh

      - name: Save compat jars
        if: steps.compat-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Runtime/ExtensionHost/compat
          key: ${{ steps.compat-cache.outputs.cache-primary-key }}

      - name: Build runtime jars
        run: bash iosApp/Scripts/build-jvm-runtime.sh

      - uses: actions/upload-artifact@v4
        with:
          name: jvm-runtime-jars
          path: iosApp/Vendor/jars
          retention-days: 1

  openjdk:
    name: OpenJDK runtime
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Restore runtime cache
        id: runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            iosApp/Vendor/jvm/OpenJDK.xcframework
            iosApp/Vendor/jvm/java_bundle-device
            iosApp/Vendor/jvm/java_bundle-simulator
            iosApp/Vendor/jvm/.ios-runtime
          key: openjdk-ios-src-${{ runner.arch }}-${{ hashFiles('iosApp/Scripts/build-openjdk-ios15.sh', 'iosApp/Scripts/add-openjdk-static-lookup.sh', 'iosApp/Scripts/patches/openjdk-mobile-ios-runtime.patch', 'iosApp/Scripts/OpenJDK.exports') }}

      - name: Select Xcode
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Set up Java 24 boot JDK
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"

      - name: Build the runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          brew install autoconf make
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          bash iosApp/Scripts/build-openjdk-ios15.sh

      - name: Save runtime cache
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            iosApp/Vendor/jvm/OpenJDK.xcframework
            iosApp/Vendor/jvm/java_bundle-device
            iosApp/Vendor/jvm/java_bundle-simulator
            iosApp/Vendor/jvm/.ios-runtime
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: openjdk-ios
          path: |
            iosApp/Vendor/jvm/OpenJDK.xcframework
            iosApp/Vendor/jvm/java_bundle-device
            iosApp/Vendor/jvm/java_bundle-simulator
            iosApp/Vendor/jvm/.ios-runtime
          retention-days: 1

  testflight:
    name: Archive firmado → TestFlight
    needs: [runtime, openjdk]
    runs-on: macos-26
    env:
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'cl.jonas.tachitest' }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: jvm-runtime-jars
          path: iosApp/Vendor/jars

      - uses: actions/download-artifact@v4
        with:
          name: openjdk-ios
          path: iosApp/Vendor/jvm

      - name: Stage the JVM runtime
        run: bash iosApp/Scripts/stage-jvm-resources.sh device

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iosApp
          perl -pi -e "s/PRODUCT_BUNDLE_IDENTIFIER: .*/PRODUCT_BUNDLE_IDENTIFIER: $BUNDLE_ID/" project.yml
          xcodegen generate

      - name: Cache derived data
        uses: actions/cache@v4
        with:
          path: iosApp/build-ci
          key: deriveddata-archive-${{ hashFiles('iosApp/project.yml', 'iosApp/Packages/*/Sources/**') }}
          restore-keys: deriveddata-archive-

      - name: Preparar API key de App Store Connect
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          fail=0
          [ -n "$TEAM_ID" ] || { echo "::error::Falta el secret APPLE_TEAM_ID"; fail=1; }
          [ ${#TEAM_ID} -eq 10 ] || { echo "::error::APPLE_TEAM_ID debe tener 10 caracteres (tiene ${#TEAM_ID})"; fail=1; }
          [ ${#KEY_ID} -eq 10 ] || { echo "::error::ASC_KEY_ID debe tener 10 caracteres (tiene ${#KEY_ID}). ¿Lo cambiaste por el Issuer ID?"; fail=1; }
          echo "$ISSUER_ID" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' \
            || { echo "::error::ASC_ISSUER_ID no tiene formato UUID (xxxxxxxx-xxxx-...). ¿Lo cambiaste por el Key ID?"; fail=1; }
          echo "$KEY_P8_BASE64" | tr -d ' \r\n' | base64 --decode > ~/private_keys/AuthKey.p8 2>/dev/null \
            || { echo "::error::ASC_KEY_P8_BASE64 no es base64 válido"; fail=1; }
          grep -q "BEGIN PRIVATE KEY" ~/private_keys/AuthKey.p8 \
            || { echo "::error::ASC_KEY_P8_BASE64 no decodifica a un archivo .p8 (falta BEGIN PRIVATE KEY)"; fail=1; }
          [ $fail -eq 0 ] && echo "Secrets OK: team ${TEAM_ID:0:3}…, key ${KEY_ID:0:3}…"
          exit $fail

      # Build numbers 1 and 2 of this App Store Connect record were used by the TachiyomiAZ
      # test builds, so MokaReader's start above them.
      - name: Archive (firma automática con la API key)
        run: |
          cd iosApp
          mkdir -p build
          xcodebuild \
            -project MokaReader.xcodeproj \
            -scheme MokaReader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-ci \
            -archivePath build/MokaReader.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=$(( ${{ github.run_number }} + 100 )) \
            archive 2>&1 | tee build/xcodebuild.log | grep -E "error:|warning: unable|\*\* ARCHIVE" || true
          test -d build/MokaReader.xcarchive || { echo "::group::Errores de compilación"; grep -B2 -A6 "error:" build/xcodebuild.log | head -200; echo "::endgroup::"; exit 1; }

      - name: Subir log de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: iosApp/build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Exportar y subir a TestFlight
        run: |
          cd iosApp
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/MokaReader.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
